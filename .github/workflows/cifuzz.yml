name: CIFuzz

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  Fuzzing:
    # CIFuzz builds through the OSS-Fuzz project, not this repository's CMake
    # cache. The job is allowed to fail until oss-fuzz's pybind11 build.sh
    # compiles tests/fuzz/pybind_fuzzer.cc with LIB_FUZZING_ENGINE set
    # (google/oss-fuzz#16274). The corpus replay job in ci.yml is the required check.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: pybind11
          language: c++
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        with:
          oss-fuzz-project-name: pybind11
          language: c++
          fuzz-seconds: 300
      - name: Upload Crash
        uses: actions/upload-artifact@v4
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts
