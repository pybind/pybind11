name: Upstream

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  # For cmake:
  VERBOSE: 1

jobs:
  standard:
    name: "🐍 3.15 latest • ubuntu-latest • x64"
    runs-on: ubuntu-latest
    # Only runs when the  'python dev' label is selected
    if: "contains(github.event.pull_request.labels.*.name, 'python dev')"

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        allow-prereleases: true

    - name: Setup Boost
      run: sudo apt-get install libboost-dev

    - name: Update CMake
      uses: jwlawson/actions-setup-cmake@v2.2

    - name: Run pip installs
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements.txt

    - name: Show platform info
      run: |
        python -m platform
        cmake --version
        pip list

    # First build - C++17 Debug mode
    - name: Configure C++17 Debug
      run: >
        cmake -S . -B build-debug
        -DPYBIND11_WERROR=ON
        -DDOWNLOAD_CATCH=ON
        -DDOWNLOAD_EIGEN=ON
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_BUILD_TYPE=Debug

    - name: Build C++17 Debug
      run: cmake --build build-debug -j 2

    - name: Python tests C++17 Debug
      run: cmake --build build-debug --target pytest -j 2

    - name: C++17 Debug tests
      timeout-minutes: 3
      run: cmake --build build-debug --target cpptest -j 2

    - name: Interface test C++17 Debug
      run: cmake --build build-debug --target test_cmake_build

    # Second build - C++17 MinSizeRel mode
    - name: Configure C++17 MinSizeRel
      run: >
        cmake -S . -B build-minsizerel
        -DPYBIND11_WERROR=ON
        -DDOWNLOAD_CATCH=ON
        -DDOWNLOAD_EIGEN=ON
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_BUILD_TYPE=MinSizeRel

    - name: Build C++17 MinSizeRel
      run: cmake --build build-minsizerel -j 2

    - name: Python tests C++17 MinSizeRel
      run: cmake --build build-minsizerel --target pytest

    - name: C++17 MinSizeRel tests
      timeout-minutes: 3
      run: cmake --build build-minsizerel --target cpptest

    # Third build - C++17 mode with unstable ABI
    - name: Configure (unstable ABI)
      run: >
        cmake -S . -B build17max
        -DPYBIND11_WERROR=ON
        -DDOWNLOAD_CATCH=ON
        -DDOWNLOAD_EIGEN=ON
        -DCMAKE_CXX_STANDARD=17
        -DPYBIND11_INTERNALS_VERSION=10000000

    - name: Build (unstable ABI)
      run: cmake --build build17max -j 2

    - name: Python tests (unstable ABI)
      run: cmake --build build17max --target pytest

    - name: Interface test (unstable ABI)
      run: cmake --build build17max --target test_cmake_build

    # This makes sure the setup_helpers module can build packages using
    # setuptools
    - name: Setuptools helpers test
      run: |
        pip install setuptools
        pytest tests/extra_setuptools
