name: CIBW

on:
  # Run on Wednesday and Friday at 06:47 UTC.
  schedule:
    - cron: "47 6 * * 3,5"
  workflow_dispatch:
  pull_request:
    branches:
    - master
    - stable
    - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm-emscripten:
    if: (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:intentional'))
    name: Pyodide wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - uses: pypa/cibuildwheel@v4.3.5
      env:
        PYODIDE_BUILD_EXPORTS: whole_archive
      with:
        package-dir: tests
        only: cp314-pyodide_wasm32

  build-ios:
    if: (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:intentional'))
    name: iOS wheel ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runs-on: macos-15
          build: cp314-*
          archs: auto
        - runs-on: macos-15-intel
          build: cp313-* cp315-*
          archs: x86_64_iphonesimulator
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    # We have to uninstall first because GH is now using a local tap to build cmake<4, iOS needs cmake>=4
    - run: brew uninstall cmake && brew install cmake

    - uses: pypa/cibuildwheel@v4.3.5
      env:
        CIBW_PLATFORM: ios
        CIBW_BUILD: ${{ matrix.build }}
        CIBW_ARCHS: ${{ matrix.archs }}
      with:
        package-dir: tests

  build-android:
    if: (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:intentional'))
    name: Android wheel ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # macOS can only build, so one Python version each is enough there
        - runs-on: macos-latest
          build: cp314-*
        - runs-on: macos-15-intel
          build: cp313-*
        - runs-on: ubuntu-latest
          build: "*"
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    # GitHub Actions can't currently run the Android emulator on macOS.
    - name: Skip Android tests on macOS
      if: contains(matrix.runs-on, 'macos')
      run: echo "CIBW_TEST_COMMAND=" >> "$GITHUB_ENV"

    - uses: pypa/cibuildwheel@v4.3.5
      env:
        CIBW_PLATFORM: android
        CIBW_BUILD: ${{ matrix.build }}
      with:
        package-dir: tests
