name: Intentional CI experiment

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      request:
        description: JSON with the PR, profile, head SHA, base SHA, and comment ID
        required: true
        type: string

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'pybind/pybind11' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'rwgk' &&
      startsWith(github.event.comment.body, '/ci ')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const match = /^\/ci (full|quick|help)$/.exec(context.payload.comment.body.trim());
            if (!match) return;

            const {data: pr} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            if (pr.state !== 'open' || pr.user.login !== 'rwgk'
                || !pr.labels.some(label => label.name === 'ci:manual')) return;

            if (match[1] === 'help') {
              await core.summary.addHeading('Intentional CI experiment')
                .addRaw('Use `/ci full` or `/ci quick` on a PR labeled `ci:manual`. '
                  + 'Only rwgk can request runs on their own PRs during this pilot. '
                  + 'The development worker must be installed first; see '
                  + '`.github/intentional-ci.md`.').write();
              return;
            }

            const request = {
              pr: pr.number,
              profile: match[1],
              head_sha: pr.head.sha,
              base_sha: pr.base.sha,
              comment_id: context.payload.comment.id,
            };
            try {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'intentional-ci.yml',
                ref: 'rwgk/intentional-ci-dev',
                inputs: {request: JSON.stringify(request)},
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              core.setFailed('Cannot dispatch the experimental worker. Create '
                + 'rwgk/intentional-ci-dev from master after this bootstrap merges '
                + 'and keep intentional-ci.yml with its workflow_dispatch input. '
                + error.message);
              return;
            }
            await core.summary.addHeading('Experimental CI requested')
              .addCodeBlock(JSON.stringify(request, null, 2), 'json').write();

  bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          REQUEST: ${{ inputs.request }}
        with:
          script: |
            await core.summary.addHeading('Bootstrap only: no tests executed')
              .addRaw('Implement the dispatch worker on `rwgk/intentional-ci-dev`. '
                + 'This placeholder does not publish a CI result for the PR.')
              .addCodeBlock(process.env.REQUEST, 'json').write();
